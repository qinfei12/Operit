name: Promote Artifact to Release Draft

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "target workflow run ID, e.g. 33588889504"
        required: true
        type: string
      artifact_name:
        description: "artifact name (optional, auto pick first if empty)"
        required: false
        type: string
        default: ""
      tag_name:
        description: "target release tag (optional, auto-generated if empty)"
        required: false
        type: string
        default: ""

concurrency:
  group: promote-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Promote APK artifact to Release Draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Resolve run metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_ARTIFACT: ${{ inputs.artifact_name }}
          IN_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          RUN_ID="$IN_RUN_ID"
          echo "[info] run_id = $RUN_ID"

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          ARTS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"

          # 使用 heredoc 解析 JSON，避免 YAML 对引号/冒号的任何误解析
          PARSED_OUT="$(mktemp)"
          python3 - "$RUN_JSON" "$ARTS_JSON" "$IN_ARTIFACT" "$IN_TAG" "$PARSED_OUT" <<'PYEOF'
          import json, sys
          run_path, arts_path, in_artifact, in_tag, out_path = sys.argv[1:6]
          # 注意：前两个是 JSON 字符串，不是路径
          run = json.loads(run_path)
          arts = json.loads(arts_path)
          head_sha     = run["head_sha"]
          head_branch  = run["head_branch"]
          run_number   = run["run_number"]
          conclusion   = run.get("conclusion") or "pending"
          commit_short = head_sha[:7]
          # 选 artifact
          wanted = in_artifact.strip() if in_artifact else ""
          if not wanted:
              cands = [a for a in arts.get("artifacts", []) if not a.get("expired", True)]
              fallback = arts.get("artifacts", [])
              pick_list = cands or fallback
              if pick_list:
                  wanted = pick_list[0]["name"]
          tag = in_tag.strip() if in_tag else ""
          if not tag:
              tag = f"debug-build-{run_number}-{commit_short}"
          release_name = f"Debug Build #{run_number} ({commit_short})"
          with open(out_path, "w", encoding="utf-8") as f:
              # 加引号 + sh-escape，避免含空格/井号/括号的值被 shell 误解
              import shlex
              def shv(v: str) -> str:
                  return shlex.quote(v if v is not None else "")
              f.write(f"HEAD_SHA={shv(head_sha)}\n")
              f.write(f"HEAD_BRANCH={shv(head_branch)}\n")
              f.write(f"RUN_NUMBER={shv(str(run_number))}\n")
              f.write(f"CONCLUSION={shv(conclusion)}\n")
              f.write(f"COMMIT_SHORT={shv(commit_short)}\n")
              f.write(f"ARTIFACT={shv(wanted)}\n")
              f.write(f"TAG={shv(tag)}\n")
              f.write(f"RELEASE_NAME={shv(release_name)}\n")
          # 再把概览打到 stdout（仅供日志看）
          print(f"  head_sha     = {head_sha}")
          print(f"  head_branch  = {head_branch}")
          print(f"  run_number   = {run_number}")
          print(f"  conclusion   = {conclusion}")
          print(f"  commit_short = {commit_short}")
          print(f"  artifact_cnt = {arts.get('total_count', 0)}")
          for a in arts.get("artifacts", []):
              mb = a["size_in_bytes"] / 1024 / 1024
              print(f"    - id={a['id']} name={a['name']} size={mb:.1f}MB expired={a['expired']}")
          print(f"  picked_artifact = {wanted}")
          print(f"  tag             = {tag}")
          print(f"  release_name    = {release_name}")
          PYEOF

          # 加载解析结果
          # shellcheck disable=SC1090
          source "$PARSED_OUT"
          rm -f "$PARSED_OUT"

          if [ -z "${ARTIFACT:-}" ]; then
            echo "::error::No artifact resolved, cannot continue."
            exit 1
          fi
          if [ "${CONCLUSION}" != "success" ] && [ "${CONCLUSION}" != "skipped" ]; then
            echo "::warning::Run ${RUN_ID} conclusion=${CONCLUSION}, continuing anyway (artifact may already be uploaded)."
          fi

          {
            echo "head_sha=${HEAD_SHA}"
            echo "head_branch=${HEAD_BRANCH}"
            echo "run_number=${RUN_NUMBER}"
            echo "artifact=${ARTIFACT}"
            echo "tag=${TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "commit_short=${COMMIT_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
          WANTED_ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          gh run download "$TARGET_RUN_ID" \
            --name "$WANTED_ARTIFACT" \
            --dir /tmp/apks \
            --repo "${GITHUB_REPOSITORY}"
          echo "--- downloaded files ---"
          find /tmp/apks -type f -printf "%s %p\n" | sort -nr | awk '{ printf "  %6.1f MB  %s\n", $1/1024/1024, $2 }'
          echo "--- APKs only ---"
          find /tmp/apks -name "*.apk" -type f -printf "%s %p\n" | sort -nr | awk '{ printf "  %6.1f MB  %s\n", $1/1024/1024, $2 }'

      - name: Create / update Release Draft and upload APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RUN_ID: ${{ inputs.run_id }}
          META_TAG: ${{ steps.meta.outputs.tag }}
          META_RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          META_COMMIT: ${{ steps.meta.outputs.commit_short }}
          META_SHA: ${{ steps.meta.outputs.head_sha }}
          META_BRANCH: ${{ steps.meta.outputs.head_branch }}
          META_RUN_NUMBER: ${{ steps.meta.outputs.run_number }}
        run: |
          set -euo pipefail

          TAG="$META_TAG"
          RELEASE_NAME="$META_RELEASE_NAME"
          COMMIT_SHORT="$META_COMMIT"
          HEAD_SHA="$META_SHA"
          HEAD_BRANCH="$META_BRANCH"
          RUN_NUMBER="$META_RUN_NUMBER"

          mapfile -t APK_FILES < <(find /tmp/apks -name "*.apk" -type f -printf "%s %p\n" | sort -nr | awk '{print $2}')
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK files found in artifact."
            exit 2
          fi
          echo "Will upload ${#APK_FILES[@]} APKs:"
          for apk in "${APK_FILES[@]}"; do
            SIZE_MB="$(awk -v s="$(stat -c%s "$apk")" 'BEGIN{ printf "%.1f", s/1024/1024 }')"
            echo "  - $(basename "$apk") (${SIZE_MB} MB)"
          done

          NOTES_FILE="$(mktemp)"
          # 使用 heredoc 写 notes，避免 awk 插值里的反斜杠和 YAML 冲突
          python3 - "$NOTES_FILE" "$RUN_NUMBER" "${IN_RUN_ID}" "$HEAD_SHA" "$HEAD_BRANCH" "$COMMIT_SHORT" \
            "/tmp/apks" "${GITHUB_REPOSITORY}" <<'PYEOF'
          import os, subprocess, sys
          notes_path, run_number, in_run_id, head_sha, head_branch, commit_short, apks_dir, repo = sys.argv[1:9]
          # 枚举 APK
          apks = []
          for root, dirs, files in os.walk(apks_dir):
              for name in files:
                  if name.lower().endswith(".apk"):
                      fp = os.path.join(root, name)
                      apks.append((name, os.path.getsize(fp)))
          apks.sort(key=lambda x: x[1], reverse=True)
          import datetime
          now_utc = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
          lines = []
          lines.append("## Auto-promoted Debug APK (no rebuild)")
          lines.append("")
          lines.append(f"- Original Workflow Run: [#{run_number}](https://github.com/{repo}/actions/runs/{in_run_id})")
          lines.append(f"- Commit: `{head_sha}` (branch `{head_branch}`, short `{commit_short}`)")
          lines.append(f"- Promoted at (UTC): `{now_utc}`")
          lines.append("")
          lines.append("### APK assets")
          for name, size in apks:
              mb = size / 1024 / 1024
              lines.append(f"- `{name}` ({mb:.1f} MB)")
          lines.append("")
          lines.append("> This release was generated by the promote-artifact-to-release workflow.")
          lines.append("> It does NOT rebuild the Android app — it only republishes existing workflow artifacts")
          lines.append("> as release assets, for faster direct-download access.")
          with open(notes_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("--- release notes preview ---")
          print(open(notes_path, encoding="utf-8").read())
          print("------------------------------")
          PYEOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[info] Release $TAG already exists; updating title/notes and replacing APK assets..."
            for apk in "${APK_FILES[@]}"; do
              gh release delete-asset -y "$TAG" "$(basename "$apk")" 2>/dev/null || true
            done
            gh release edit "$TAG" \
              --title "$RELEASE_NAME" \
              --notes-file "$NOTES_FILE" \
              --draft
          else
            echo "[info] Creating new draft release: $TAG"
            gh release create "$TAG" \
              --draft \
              --title "$RELEASE_NAME" \
              --notes-file "$NOTES_FILE" \
              --target "$HEAD_BRANCH"
          fi

          for apk in "${APK_FILES[@]}"; do
            echo "[upload] $(basename "$apk")"
            gh release upload "$TAG" "$apk" --clobber
          done

          echo ""
          echo "OK. Draft release ready:"
          echo "  tag = $TAG"
          echo "  URL = https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
